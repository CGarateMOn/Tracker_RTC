<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#26346B">
<title>RTC · Ofertas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="gate"><div class="inner">
  <h1>¿Qué buscas?</h1>
  <p>Filtramos el tablón para enseñarte solo lo que te sirve. Puedes cambiarlo cuando quieras.</p>
  <button class="gopt" data-g="practicas">Prácticas<small>Summer y off-cycle</small></button>
  <button class="gopt" data-g="full">Tiempo completo<small>Graduate programme y entrada directa</small></button>
  <button class="gopt" data-g="ambas">Las dos<small>Enséñamelo todo</small></button>
</div></div>

<header><div class="wrap">
  <div class="brand"><b>Road to Consulting</b><span>Ofertas</span></div>
  <button class="modo" id="modo"></button>
</div></header>

<div class="bar"><div class="wrap">
  <input id="q" class="search" type="search" placeholder="Buscar empresa, puesto o ciudad" autocomplete="off">
  <div class="filtros" id="row1"></div>
  <div class="filtros" id="row2"></div>
  <div class="estadoline" id="estadoline"></div>
</div></div>

<main class="wrap">
  <div class="meta-bar">
    <span class="count" id="count">Cargando…</span>
    <button class="reset" id="reset" hidden>Quitar filtros</button>
  </div>
  <div id="hint"></div>
  <ul id="list"></ul>
  <p class="foot" id="foot"></p>
</main>

<footer class="site-foot"><div class="wrap">
  Road To Consulting, a Talentum brand.<br>All rights reserved.<br>Madrid, Comunidad de Madrid
</div></footer>

<script src="script.js"></script>
</body>
</html>
