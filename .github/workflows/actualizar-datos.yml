name: Actualizar datos

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Descargar y validar los datos del Apps Script
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 10 --max-time 60 \
            -o datos.nuevo.json "$APPS_SCRIPT_URL"

          if ! jq empty datos.nuevo.json; then
            echo "::error::La respuesta no es JSON válido — no se toca datos.json."
            rm -f datos.nuevo.json
            exit 1
          fi

          mv datos.nuevo.json datos.json

      - name: Commit solo si ha cambiado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos.json
          if git diff --cached --quiet; then
            echo "Sin cambios, no se hace commit."
            exit 0
          fi
          git commit -m "datos: actualización automática"
          git push
